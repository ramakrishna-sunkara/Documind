name: Code Review

on:
  pull_request:
    branches: [main, develop, 'feature/*']
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  code-review:
    name: Static Analysis & Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create reports directory
        run: mkdir -p reports
      
      # Run Detekt
      - name: Run Detekt
        id: detekt
        run: |
          ./gradlew detekt --continue || true
          echo "detekt_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      # Run ktlint
      - name: Run ktlint
        id: ktlint
        run: |
          ./gradlew ktlintCheck --continue || true
          echo "ktlint_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      # Run Android Lint (optional, may take longer)
      - name: Run Android Lint
        id: lint
        run: |
          ./gradlew lintFreeDebug --continue || true
          echo "lint_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      # Run Project Rules Check
      - name: Run Project Rules Check
        id: rules
        run: |
          # Get changed files in PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E "\.kt$|\.kts$" || echo "")
          
          if [ -n "$CHANGED_FILES" ]; then
            python3 scripts/check-rules.py \
              --rules code-review-rules/ \
              --files "$CHANGED_FILES" \
              --output reports/rules.json \
              --severity warning || true
          else
            echo '{"total_violations": 0, "violations": []}' > reports/rules.json
          fi
        continue-on-error: true
      
      # Post inline review comments
      - name: Post Review Comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Helper to parse detekt XML
            function parseDetektXml(xmlPath) {
              const violations = [];
              try {
                const content = fs.readFileSync(xmlPath, 'utf8');
                const errorRegex = /<error line="(\d+)" column="\d+" severity="(\w+)" message="([^"]+)" source="([^"]+)"[^>]*\/>/g;
                const fileRegex = /<file name="([^"]+)">([\s\S]*?)<\/file>/g;
                
                let fileMatch;
                while ((fileMatch = fileRegex.exec(content)) !== null) {
                  const filePath = fileMatch[1];
                  const fileContent = fileMatch[2];
                  
                  let errorMatch;
                  while ((errorMatch = errorRegex.exec(fileContent)) !== null) {
                    violations.push({
                      file: filePath.replace(process.cwd() + '/', ''),
                      line: parseInt(errorMatch[1]),
                      severity: errorMatch[2],
                      message: `[Detekt] ${errorMatch[3]}`,
                      rule: errorMatch[4]
                    });
                  }
                }
              } catch (e) {
                console.log('Could not parse detekt report:', e.message);
              }
              return violations;
            }
            
            // Helper to parse ktlint JSON
            function parseKtlintJson(jsonPath) {
              const violations = [];
              try {
                const content = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                for (const file of content) {
                  for (const error of file.errors || []) {
                    violations.push({
                      file: file.file.replace(process.cwd() + '/', ''),
                      line: error.line,
                      severity: 'warning',
                      message: `[ktlint] ${error.message}`,
                      rule: error.rule
                    });
                  }
                }
              } catch (e) {
                console.log('Could not parse ktlint report:', e.message);
              }
              return violations;
            }
            
            // Helper to parse project rules JSON
            function parseRulesJson(jsonPath) {
              const violations = [];
              try {
                const content = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                for (const v of content.violations || []) {
                  violations.push({
                    file: v.file,
                    line: v.line,
                    severity: v.severity,
                    message: `[${v.rule_id}] ${v.message}`,
                    rule: v.rule_id
                  });
                }
              } catch (e) {
                console.log('Could not parse rules report:', e.message);
              }
              return violations;
            }
            
            // Collect all violations
            let allViolations = [];
            
            // Parse reports from various locations
            const detektPaths = [
              'app/build/reports/detekt/detekt.xml',
              'prescription_demo/build/reports/detekt/detekt.xml'
            ];
            for (const p of detektPaths) {
              if (fs.existsSync(p)) {
                allViolations = allViolations.concat(parseDetektXml(p));
              }
            }
            
            const ktlintPaths = [
              'app/build/reports/ktlint/ktlintMainSourceSetCheck/ktlintMainSourceSetCheck.json',
              'app/build/reports/ktlint/ktlintFreeDebugSourceSetCheck/ktlintFreeDebugSourceSetCheck.json'
            ];
            for (const p of ktlintPaths) {
              if (fs.existsSync(p)) {
                allViolations = allViolations.concat(parseKtlintJson(p));
              }
            }
            
            if (fs.existsSync('reports/rules.json')) {
              allViolations = allViolations.concat(parseRulesJson('reports/rules.json'));
            }
            
            console.log(`Found ${allViolations.length} total violations`);
            
            // Get changed files in PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const changedFiles = new Set(files.map(f => f.filename));
            const changedLines = new Map();
            
            for (const file of files) {
              if (file.patch) {
                const lines = new Set();
                const patchLines = file.patch.split('\n');
                let lineNum = 0;
                
                for (const line of patchLines) {
                  const match = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)/);
                  if (match) {
                    lineNum = parseInt(match[1]) - 1;
                  } else if (line.startsWith('+') && !line.startsWith('+++')) {
                    lineNum++;
                    lines.add(lineNum);
                  } else if (!line.startsWith('-')) {
                    lineNum++;
                  }
                }
                changedLines.set(file.filename, lines);
              }
            }
            
            // Filter violations to only changed lines
            const relevantViolations = allViolations.filter(v => {
              const normalizedPath = v.file.replace(/^\//, '');
              if (!changedFiles.has(normalizedPath)) return false;
              
              const fileLines = changedLines.get(normalizedPath);
              return fileLines && fileLines.has(v.line);
            });
            
            console.log(`${relevantViolations.length} violations on changed lines`);
            
            // Post review comments (max 50 to avoid rate limiting)
            const comments = relevantViolations.slice(0, 50).map(v => ({
              path: v.file.replace(/^\//, ''),
              line: v.line,
              body: v.message
            }));
            
            if (comments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'COMMENT',
                  comments: comments
                });
                console.log(`Posted ${comments.length} inline comments`);
              } catch (e) {
                console.log('Could not post review comments:', e.message);
              }
            }
            
            // Store violations count for summary
            core.exportVariable('TOTAL_VIOLATIONS', allViolations.length);
            core.exportVariable('RELEVANT_VIOLATIONS', relevantViolations.length);
      
      # Post summary comment
      - name: Post Summary Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Count issues from reports
            let detektCount = 0;
            let ktlintCount = 0;
            let rulesCount = 0;
            let lintCount = 0;
            
            // Parse detekt
            const detektPaths = [
              'app/build/reports/detekt/detekt.xml',
              'prescription_demo/build/reports/detekt/detekt.xml'
            ];
            for (const p of detektPaths) {
              try {
                if (fs.existsSync(p)) {
                  const content = fs.readFileSync(p, 'utf8');
                  detektCount += (content.match(/<error /g) || []).length;
                }
              } catch (e) {}
            }
            
            // Parse rules
            try {
              if (fs.existsSync('reports/rules.json')) {
                const rules = JSON.parse(fs.readFileSync('reports/rules.json', 'utf8'));
                rulesCount = rules.total_violations || 0;
              }
            } catch (e) {}
            
            // Build summary
            const detektStatus = detektCount === 0 ? '✅ PASS' : `⚠️ ${detektCount} issues`;
            const ktlintStatus = '${{ steps.ktlint.outcome }}' === 'success' ? '✅ PASS' : '⚠️ Issues found';
            const lintStatus = '${{ steps.lint.outcome }}' === 'success' ? '✅ PASS' : '⚠️ Issues found';
            const rulesStatus = rulesCount === 0 ? '✅ PASS' : `⚠️ ${rulesCount} issues`;
            
            const totalIssues = detektCount + rulesCount;
            const overallStatus = totalIssues === 0 ? '✅' : '⚠️';
            
            const body = `## ${overallStatus} Code Review Summary
            
            | Check | Status |
            |-------|--------|
            | Detekt (Static Analysis) | ${detektStatus} |
            | ktlint (Formatting) | ${ktlintStatus} |
            | Android Lint | ${lintStatus} |
            | Project Rules | ${rulesStatus} |
            
            ${totalIssues > 0 ? `
            ### Issues Found
            
            ${detektCount > 0 ? `- **Detekt**: ${detektCount} issue(s) - check inline comments` : ''}
            ${rulesCount > 0 ? `- **Project Rules**: ${rulesCount} issue(s) - check inline comments` : ''}
            
            Please address the issues above before merging.
            ` : `
            ### All Checks Passed! 🎉
            
            No issues found. Ready to merge.
            `}
            
            ---
            <details>
            <summary>📋 How to run locally</summary>
            
            \`\`\`bash
            # One-time setup
            ./scripts/install-hooks.sh
            
            # Manual review
            ./scripts/review.sh
            \`\`\`
            </details>
            `;
            
            // Find and update or create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('Code Review Summary')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
      
      # Set check status
      - name: Check Results
        if: always()
        run: |
          # Read rules report
          if [ -f "reports/rules.json" ]; then
            ERRORS=$(python3 -c "import json; d=json.load(open('reports/rules.json')); print(d.get('by_severity', {}).get('error', 0))")
          else
            ERRORS=0
          fi
          
          echo "Total errors: $ERRORS"
          
          # Fail if there are errors (not warnings)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Code review found $ERRORS error(s). Please fix before merging."
            exit 1
          fi
          
          echo "Code review passed!"
